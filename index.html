<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading-App</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#000;color:#fff;font:16px -apple-system,sans-serif;padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(12px,env(safe-area-inset-left))}
#viewSearch{padding:0 4px}
input{width:100%;padding:14px;margin:16px 0 8px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;font-size:17px}
.row{padding:12px 4px;border-bottom:1px solid #222}
.sub{color:#888;font-size:13px;margin-top:2px}
.err{color:#ff6b6b;font-size:14px;margin:8px 0}
.up{color:#00c805}.down{color:#ff3b30}
#viewChart{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:8px;padding:6px 0}
#back{background:none;border:0;color:#fff;font-size:30px;line-height:1;padding:0 8px 4px 0}
#title{font-size:15px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#price{font-size:30px;font-weight:600;min-height:36px}
#chg{font-size:15px;min-height:20px}
.ohlc{font-size:12px;min-height:18px;margin:4px 0;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:6px;overflow-x:auto;padding:5px 0;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:16px;border:1px solid #2a2a2a;background:#111;color:#bbb;font-size:14px}
.chip.on{background:#fff;color:#000;border-color:#fff}
#chart{flex:1;min-height:120px;position:relative}
#info{padding:6px 0;line-height:1.35}
@media (orientation:landscape) and (max-height:500px){#price{font-size:20px;min-height:0}#info{display:none}}
</style>
</head>
<body>
<div id="viewSearch">
  <input id="q" placeholder="Aktie oder Krypto suchen" autocomplete="off" autocapitalize="off">
  <div id="errs"></div>
  <div id="list"></div>
</div>
<div id="viewChart" hidden>
  <div class="top"><button id="back" aria-label="Zurück">‹</button><div id="title"></div></div>
  <div id="price"></div>
  <div id="chg"></div>
  <div id="ohlc" class="ohlc"></div>
  <div class="bar" id="tfBar"></div>
  <div id="chart"></div>
  <div class="bar" id="rangeBar"></div>
  <div class="bar" id="typeBar"></div>
  <div id="info" class="sub"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
